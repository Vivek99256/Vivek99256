<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="1280" height="520"><title>My developer way</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b0d13"/><stop offset="1" stop-color="#19131b"/></linearGradient><linearGradient id="g"><stop stop-color="#ff7a1a"/><stop offset=".5" stop-color="#e2383f"/><stop offset="1" stop-color="#c77dff"/></linearGradient><style>@keyframes pulse{50%{opacity:.4}}.p{animation:pulse 3s infinite}</style></defs><rect width="1280" height="520" rx="28" fill="url(#bg)" stroke="#ff7a1a" stroke-width="3"/><text x="65" y="76" fill="#ff7a1a" font-size="20" letter-spacing="5">MY NINJA WAY / WHAT I BUILD</text><text x="65" y="137" fill="#fff" font-size="42" font-weight="bold">Turning ideas into real products.</text><g><rect x="65" y="188" width="350" height="250" rx="18" fill="#15131a" stroke="#ff7a1a" stroke-width="2"/><text x="95" y="243" fill="#ff7a1a" font-size="23">01 / ARCHITECT</text><text x="95" y="302" fill="#fff" font-size="28" font-weight="bold">Reliable systems</text><text x="95" y="350" fill="#c9c2cd" font-size="19">APIs, databases, ERP</text><text x="95" y="380" fill="#c9c2cd" font-size="19">and education platforms.</text></g><g><rect x="465" y="188" width="350" height="250" rx="18" fill="#15131a" stroke="#c77dff" stroke-width="2"/><text x="495" y="243" fill="#c77dff" font-size="23">02 / CREATE</text><text x="495" y="302" fill="#fff" font-size="28" font-weight="bold">Smooth experiences</text><text x="495" y="350" fill="#c9c2cd" font-size="19">Responsive interfaces</text><text x="495" y="380" fill="#c9c2cd" font-size="19">and mobile workflows.</text></g><g><rect x="865" y="188" width="350" height="250" rx="18" fill="#15131a" stroke="#2fd48a" stroke-width="2"/><text x="895" y="243" fill="#2fd48a" font-size="23">03 / AUTOMATE</text><text x="895" y="302" fill="#fff" font-size="28" font-weight="bold">Work smarter</text><text x="895" y="350" fill="#c9c2cd" font-size="19">Integrations, reporting</text><
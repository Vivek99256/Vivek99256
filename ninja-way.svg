<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="1280" height="520"><title>My developer way</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10101b"/><stop offset="1" stop-color="#251429"/></linearGradient><linearGradient id="g"><stop stop-color="#ff9a3d"/><stop offset="1" stop-color="#ca78ff"/></linearGradient><style>@keyframes pulse{50%{opacity:.45}}.p{animation:pulse 3s infinite}</style></defs><rect width="1280" height="520" rx="30" fill="url(#bg)" stroke="#80516e" stroke-width="3"/><text x="65" y="76" fill="#ffaf70" font-size="20" letter-spacing="5">MY DEVELOPER WAY / WHAT I BUILD</text><text x="65" y="137" fill="#fff" font-size="42" font-weight="bold">Turning ideas into real products.</text>
<g><rect x="65" y="188" width="350" height="250" rx="22" fill="#201b32" stroke="#ff9a3d"/><text x="95" y="243" fill="#ffb16e" font-size="24">01 / ARCHITECT</text><text x="95" y="302" fill="#fff" font-size="29" font-weight="bold">Reliable systems</text><text x="95" y="350" fill="#c9bfd2" font-size="19">APIs, databases, ERP</text><text x="95" y="380" fill="#c9bfd2" font-size="19">and education platforms.</text></g>
<g><rect x="465" y="188" width="350" height="250" rx="22" fill="#201b32" stroke="#ca78ff"/><text x="495" y="243" fill="#d5a9ff" font-size="24">02 / CREATE</text><text x="495" y="302" fill="#fff" font-size="29" font-weight="bold">Smooth experiences</text><text x="495" y="350" fill="#c9bfd2" font-size="19">Responsive interfaces</text><text x="495" y="380" fill="#c9bfd2" font-size="19">and mobile workflows.</text></g>
<g><rect x="865" y="188" width="350" height="250" rx="22" fill="#201b32" stroke="#ff658e"/><text x="895" y="243" fill="#ff9ab1" font-size="24">03 / AUTOMATE</text><text x="895" y="302" fill="#fff" font-size="29" font-weight="bold">Work smarter</text><text x="895" y="350" fill="#c9bfd2" font-size="19">Integrations, reporting</text><text x="895" y="380" fill="#c9bfd2" font-size="19">and practical automation.</text></g><path d="M65 476 H1215" stroke="url(#g)" stroke-width="3" class="p"/></svg>